server:
  port: 8084
spring:
  application:
    name: pedido-service
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
resilience4j:
  circuitbreaker:
    instances:
      clienteService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
  retry:
    instances:
      clienteService:
        maxAttempts: 3
        waitDuration: 500ms
  bulkhead:
    instances:
      productoService:
        maxConcurrentCalls: 2
        maxWaitDuration: 1s
