spring:
  application:
    name: empleados-service
  profiles:
    active: ${PROFILE_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/empleados_dev}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}
empresa:
  ambiente: ${AMBIENTE:DESARROLLO}
